services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-fdc-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/data/gestao_fdc.db
    volumes:
      - gestao-fdc-data:/data

volumes:
  gestao-fdc-data:
